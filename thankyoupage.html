      margin: 0 auto 1.75rem;
    }

    .icon-circle svg {

      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

      line-height: 1.65;

    .info-banner {

      border-radius: 8px;

    .info-banner svg {
      width: 16px;
      height: 16px;
      stroke: #6236FF;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .info-banner strong { color: #6236FF; }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .btn-primary {
      display: inline-block;
      background: #6236FF;
      color: #fff;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .btn-primary:hover { background: #5228e8; }

    .btn-secondary {
      display: inline-block;
      background: #fff;
      color: #6236FF;
      border: 1.5px solid #6236FF;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .btn-secondary:hover { background: #f3eeff; }

    .divider {
      border: none;
      border-top: 0.5px solid #ebebeb;
      margin: 0 0 1.5rem;
    }

    .social-label {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 0.75rem;
    }

    .social-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #6236FF;
      border: 0.5px solid #c9befc;
      border-radius: 6px;
      padding: 7px 14px;
      cursor: pointer;
      background: #fff;
      text-decoration: none;
      transition: background 0.12s ease;
    }

    .social-btn:hover { background: #f3eeff; }

    .social-btn svg {
      width: 14px;
      height: 14px;
      stroke: #6236FF;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 480px) {

      h1 { font-size: 26px; }
